name: Keep Supabase Active

on:
  schedule:
    # Daily is plenty against a seven day pause timer, and it leaves six days
    # of slack if one run fails.
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      # The target list lives in index.js. It used to be pasted into this file
      # as well, and the two copies drifted, which is how a deleted project
      # stayed on the list for months.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # A failing step is the alert: GitHub mails the owner when a scheduled
      # workflow fails. Nothing here swallows an error on purpose.
      - run: node index.js
        env:
          FAXGO_DB_URL: ${{ secrets.FAXGO_DB_URL }}
